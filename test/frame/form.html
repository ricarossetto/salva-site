<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Form Builder de teste</title>
    <style>
      * { box-sizing: border-box; }
      body { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: 24px 0 80px; font: 16px/1.45 system-ui, sans-serif; }
      label { display: grid; gap: 7px; margin: 0 0 30px; }
      input, select, textarea { width: 100%; padding: 13px; border: 1px solid #aebfd2; border-radius: 9px; font: inherit; }
      .gap { height: 280px; display: grid; place-items: center; background: #f4f7fb; }
    </style>
  </head>
  <body>
    <h1>Formulário interno preenchido</h1>
    <label>Nome da parte<input value="Valor preservado dentro do embed"></label>
    <label>Estado geral<select><option selected>bom estado geral</option></select></label>
    <div class="gap">Trecho intermediário</div>
    <label>Observações<textarea rows="6">Conteúdo que só aparece depois de rolar o documento incorporado.</textarea></label>
    <div class="gap">Segundo trecho intermediário</div>
    <label>Conclusão<input value="Fim do formulário interno"></label>
    <p>Última linha do documento incorporado.</p>
  </body>
</html>
